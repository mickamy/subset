services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: dev
    ports:
      - "5432:5432"
    volumes:
      - ./compose/init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: pass
      MYSQL_DATABASE: dev
    ports:
      - "3306:3306"
    volumes:
      - ./compose/init/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ppass"]
      interval: 2s
      timeout: 3s
      retries: 10
